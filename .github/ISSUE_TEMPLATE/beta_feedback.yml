name: 베타 사용 후기 / Beta experience
description: 사용 7일 또는 14일 뒤 실제로 활용한 기능과 불편을 알려 주세요.
title: "[Beta feedback] "
body:
  - type: markdown
    attributes:
      value: "자발적인 공개 후기입니다. 구체적인 계정·결제 정보는 적지 마세요. This is voluntary public feedback; omit private account and billing details."
  - type: dropdown
    id: period
    attributes:
      label: 사용 기간 / Time using the beta
      options:
        - 7일 전후 / Around 7 days
        - 14일 이상 / At least 14 days
        - 설치 후 사용하지 않음 / Installed but did not use
    validations:
      required: true
  - type: dropdown
    id: continued
    attributes:
      label: 최근에도 사용했나요 / Have you used it recently
      options:
        - 예 / Yes
        - 아니요 / No
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: 실제 사용한 기능과 경험 / Features actually used and experience
      description: 한도 표시, 구독 날짜, 저장 초기화 일정 중 도움이 된 점을 날짜·금액 없이 알려 주세요.
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: 불편과 개선점 / Friction and improvements
  - type: dropdown
    id: future
    attributes:
      label: 앞으로도 사용할 생각인가요 / Would you continue using it
      options:
        - 예 / Yes
        - 아니요 / No
        - 모르겠음 / Unsure
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 공개 내용 확인 / Public content check
      options:
        - label: 개인정보·원본 로그·백업을 포함하지 않았습니다. No private data, original logs or backups are included.
          required: true
